<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ورود — منوکده</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script src="/config.js"></script>
</head>
<body>
  <main class="auth-shell">
    <div class="card auth-card">
      <a class="brand" href="/">
        <span class="logo-dot" aria-hidden="true" data-brand-icon></span>
        <span data-brand-name>منوکده</span>
      </a>
      <h1 class="auth-title" data-login-title>ورود به داشبورد</h1>
      <div class="auth-error hidden" data-login-error role="alert"></div>
      <form data-login-form novalidate>
        <div class="field">
          <label for="email" data-l-email>ایمیل</label>
          <input class="input" type="email" id="email" name="email" autocomplete="email" required dir="ltr" style="text-align:end" />
        </div>
        <div class="field">
          <label for="password" data-l-password>گذرواژه</label>
          <input class="input" type="password" id="password" name="password" autocomplete="current-password" required dir="ltr" style="text-align:end" />
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" data-login-submit>ورود</button>
      </form>
      <div class="auth-hint hidden" data-demo-hint></div>
    </div>
  </main>
  <script type="module" src="/js/auth/login.js"></script>
</body>
</html>
