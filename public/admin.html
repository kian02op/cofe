<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>داشبورد مدیریت — منوکده</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script src="/config.js"></script>
  <script src="/js/vendor/qrcode.js"></script>
</head>
<body>
  <div data-demo-banner></div>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="منوی داشبورد">
      <div class="side-brand"><span class="logo-dot">م</span><span data-brand-name>منوکده</span></div>
      <div id="side-cafe"></div>
      <nav id="side-nav"></nav>
      <div class="side-foot" id="side-foot"></div>

    <div class="main">
      <header class="main-header">
        <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="باز کردن منو" data-ic="menu"></button>
        <h1 id="page-title">…</h1>
        <button class="icon-btn" id="btn-public" aria-label="مشاهده منوی عمومی" data-ic="external"></button>
        <button class="icon-btn" id="btn-logout" aria-label="خروج" data-ic="logout"></button>
      </header>
      <main class="main-content" id="main-content"></main>
    </div>
  </div>
  <div class="toast-region"></div>
  <script type="module" src="/js/admin/app.js"></script>
